name: P6D original CALMET DIVCEL divergence parity
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/divcel.hpp'
      - 'native_cpp/modules/p6_calmet/src/divcel_main.cpp'
      - 'native_cpp/modules/p6_calmet/tests/p6_divcel_tests.cpp'
      - 'native_cpp/modules/p6_calmet/reference/compare_original_divcel.py'
      - 'docs/reconstruction_cpp/CI_FULL_REGRESSION_REQUEST.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-divcel:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Select self-hosted C++20 and Fortran tools
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Install gfortran
        run: gfortran --version | head -1
      - name: Build and run all strict P6 CTests
        run: |
          cmake -S native_cpp/modules/p6_calmet -B /tmp/cteas-p6d-divcel -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cteas-p6d-divcel --parallel 2
          ctest --test-dir /tmp/cteas-p6d-divcel --output-on-failure
      - name: Original extracted DIVCEL against modern C++
        run: |
          python3 native_cpp/modules/p6_calmet/reference/compare_original_divcel.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp /tmp/cteas-p6d-divcel/cteas_p6_divcel \
            --out /tmp/p6d-divcel-reference
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-calmet-divcel-parity
          path: /tmp/p6d-divcel-reference/p6d-divcel-parity.json
          if-no-files-found: warn
          retention-days: 14
