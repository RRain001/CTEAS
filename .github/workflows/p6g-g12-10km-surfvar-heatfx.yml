name: P6G G12 10km multisite P6E SURFVAR HEATFX

on:
  push:
    branches:
      - codex/p6g-g12-multisite-surfvar-heatfx-20261014
  pull_request:
    paths:
      - "native_cpp/modules/p6_calmet/include/cteas/p6/p6g_observed_thermal_hour.hpp"
      - "native_cpp/modules/p6_calmet/include/cteas/p6/p6g_terrain_hour.hpp"
      - "native_cpp/modules/p6_calmet/tests/p6g_g12_observed_p6e_thermal_tests.cpp"
      - "native_cpp/modules/p6_calmet/tests/p6g_g8_10km_year_stress_tests.cpp"
      - "native_cpp/modules/p6_calmet/CMakeLists.txt"
      - ".github/workflows/p6g-g12-10km-surfvar-heatfx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thermal-source-bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict C++ P6G source-selected physics
        run: cmake -S native_cpp/modules/p6_calmet -B "${{ runner.temp }}/p6g-g12" -DCMAKE_BUILD_TYPE=${{ matrix.mode }}
      - name: Build two-site thermal and 8784h terrain coupled tests
        run: |
          cmake --build "${{ runner.temp }}/p6g-g12" --target \
            cteas_p6g_g12_thermal_tests cteas_p6g_g8_10km_year_tests \
            cteas_p6g_g11_terrain_tests cteas_p6g_g9_multi_wind1_tests \
            cteas_p6_final_segment_tests -j2
      - name: Run observed multi-SURF TEMP2D and source HEATFX to 8784h DIAGNO
        run: |
          ctest --test-dir "${{ runner.temp }}/p6g-g12" --output-on-failure \
            -R 'p6g_g12_10km_2surface_observed_temp_selected_heatfx_contract|p6g_g8_multisite_10km_8784h_selected_source_bridge|p6g_g11_original_terrain_dynamic_10km_source_contract|p6g_g9_expanded_10km_multi_wind1_frozen_pair_parity|p6d_original_diagno_final_segment_software'
