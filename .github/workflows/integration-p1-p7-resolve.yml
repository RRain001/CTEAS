name: Integration P6 and P7 core workflow-only conflict resolution
on:
  push:
    branches: [integration/p1-p7]
    paths:
      - '.github/workflows/integration-p1-p7-resolve.yml'
permissions:
  contents: write

jobs:
  guarded-p7-core-merge:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: github.repository == 'RRain001/CTEAS'
    steps:
      - name: Checkout complete integration history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge P7 core preserving P6 nine accepted workflows ONLY
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/integration/p1-p7
          git config user.name 'CTEAS P1-P7 integration'
          git config user.email 'cteas-integration@users.noreply.github.com'
          git fetch origin 'refs/heads/integration/p1-p7:refs/remotes/origin/integration/p1-p7'
          git fetch origin 'refs/heads/codex/cteas-p7-calpuff-20261011:refs/remotes/origin/cteas-p7-calpuff-20261011'
          test "$(git rev-parse origin/cteas-p7-calpuff-20261011)" = 6d2ad9fc00297d0ed382c59d7654bbd79c3c50ab
          test "$(git rev-parse origin/integration/p1-p7)" = "$GITHUB_SHA"
          git checkout -B integration/p1-p7 "$GITHUB_SHA"
          git merge-base --is-ancestor 7a13cc6a2f2d7b4c99e18b8866043a0319733454 HEAD
          before="$(git rev-parse HEAD)"
          set +e
          GIT_MERGE_AUTOEDIT=no git merge --no-ff --no-commit origin/cteas-p7-calpuff-20261011 >"$RUNNER_TEMP/merge.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/merge.log"
          git diff --name-only --diff-filter=U >"$RUNNER_TEMP/conflict-actual.txt"
          cat >"$RUNNER_TEMP/conflict-allowed.txt" <<'EOF'
          .github/workflows/p6d-diagno-final-segment-parity.yml
          .github/workflows/p6d-divcel-original-parity.yml
          .github/workflows/p6d-inter2-original-parity.yml
          .github/workflows/p6d-minim-original-parity.yml
          .github/workflows/p6d-similt-neutral-original-parity.yml
          .github/workflows/p6d-slope-original-parity.yml
          .github/workflows/p6d-smooth-original-parity.yml
          .github/workflows/p6d8b-wind1-firstguess-original-parity.yml
          .github/workflows/p6d9a-original-chained-diagno-parity.yml
          EOF
          # No unexplained conflict may be auto-resolved.
          test "$code" -ne 0
          LC_ALL=C sort "$RUNNER_TEMP/conflict-actual.txt" >"$RUNNER_TEMP/conflict-actual-sorted.txt"
          LC_ALL=C sort "$RUNNER_TEMP/conflict-allowed.txt" >"$RUNNER_TEMP/conflict-allowed-sorted.txt"
          diff -u "$RUNNER_TEMP/conflict-allowed-sorted.txt" "$RUNNER_TEMP/conflict-actual-sorted.txt"
          while IFS= read -r file; do
            # These are all P6 science workflows; retain newer accepted P6 branch variants.
            git checkout --ours -- "$file"
            git add -- "$file"
            git diff --cached --quiet "$before" -- "$file"
          done <"$RUNNER_TEMP/conflict-allowed.txt"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          # Explicit guarantee: P7 core merge does NOT overwrite accepted P6 C++.
          git diff --cached --quiet "$before" -- native_cpp/modules/p6_calmet
          git diff --cached --quiet "$before" -- engine/vendor/src
          echo "INTEGRATION_P7_CORE_CONFLICTS=9 ONLY_P6_WORKFLOWS RESOLUTION=OURS SOURCE_CODE_UNCHANGED_P6"
          git commit -m 'integration(P7): merge accepted core; preserve nine P6 CI workflow authorities'
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          git merge-base --is-ancestor "$before" HEAD
          git merge-base --is-ancestor 6d2ad9fc00297d0ed382c59d7654bbd79c3c50ab HEAD
          git push origin HEAD:refs/heads/integration/p1-p7
          echo "INTEGRATION_P7_CORE_MERGE=PASS HEAD=$(git rev-parse HEAD) MAIN_UNCHANGED=YES"
