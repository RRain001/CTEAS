name: P6D8B original WIND1 selected first-guess 3D field parity
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/**'
      - '.github/workflows/p6d8b-wind1-firstguess-original-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6d8b-wind1-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-wind1-firstguess:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    # P6D alone owns this custom label; never select generic self-hosted workers.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      # Official hosted Actions are ephemeral; full commit checkout replaces
      # retired desktop network detection and REST fallback.
      - name: Checkout complete immutable PR source
        uses: actions/checkout@v4
      - name: Require original source and all selected P6D implementation files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            native_cpp/modules/p6_calmet/CMakeLists.txt \
            native_cpp/modules/p6_calmet/reference/compare_original_wind1_firstguess.py \
            native_cpp/modules/p6_calmet/include/cteas/p6/wind1_selected_firstguess.hpp \
            engine/vendor/src/CALMET_v6.5.0_L150223/calmet.for \
            engine/vendor/src/CALMET_v6.5.0_L150223/params.met; do
            test -s "$path" || { echo "::error::Missing $path"; exit 1; }
          done
      - name: Install GitHub-hosted original Fortran and C++20 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++-12 gfortran-12
      - name: Select isolated versioned GCC and Fortran compilers
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Strict C++20 build and complete scoped P6 regression CTests
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/cteas-wind1-firstguess-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cmake -S native_cpp/modules/p6_calmet -B "$build" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --output-on-failure
      - name: Compare unchanged original WIND1 and SIMILT against independent C++20
        shell: bash
        run: |
          set -euo pipefail
          python3 native_cpp/modules/p6_calmet/reference/compare_original_wind1_firstguess.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp "$RUNNER_TEMP/cteas-wind1-firstguess-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/cteas_p6_wind1_firstguess" \
            --out "$RUNNER_TEMP/cteas-wind1-firstguess-parity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Save unchanged-source numerical comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6d8b-wind1-firstguess-source-parity
          path: ${{ runner.temp }}/cteas-wind1-firstguess-parity-${{ github.run_id }}-${{ github.run_attempt }}/p6d8b-wind1-firstguess-parity.json
          if-no-files-found: warn
          retention-days: 14
