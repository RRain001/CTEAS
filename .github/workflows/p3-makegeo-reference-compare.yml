name: P3 MAKEGEO independent reference and C++20 comparison
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'native_cpp/**'
      - '.github/workflows/p3-makegeo-reference-compare.yml'
      - 'docs/reconstruction_cpp/**'
jobs:
  compare:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select self-hosted C++20 and Fortran tools
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Original and C++ compilers
        run: |
          if ! pkg-config --exists gdal; then
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgdal-dev
          fi
          gfortran --version | head -1
      - name: Isolated original P1/P2 capture
        run: python3 native_cpp/reference/capture_p1_p2.py --output /tmp/p3-compare
      - name: Isolated original P3 MAKEGEO capture
        run: python3 native_cpp/reference/capture_p3_makegeo.py --output /tmp/p3-compare
      - name: Build independent C++20 MAKEGEO subset
        run: |
          cmake -S native_cpp/p3 -B /tmp/cteas-p3-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cteas-p3-build -j2
      - name: Compute modern P3 gridded geophysical parameters
        run: |
          /tmp/cteas-p3-build/cteas_p3_makegeo \
            /tmp/p3-compare/p3/makegeo.inp \
            /tmp/p3-compare/p2/lu.dat \
            /tmp/p3-compare/p1/terrel.dat \
            /tmp/p3-compare/p3_cpp_geophysical.csv \
            /tmp/p3-compare/p3_cpp_geo.dat
      - name: Independently check numeric fields and exact printed GEO.DAT
        run: python3 native_cpp/reference/compare_p3_makegeo.py --reference /tmp/p3-compare/p3/geo.dat --cpp /tmp/p3-compare/p3_cpp_geophysical.csv --cpp-geo /tmp/p3-compare/p3_cpp_geo.dat --report /tmp/p3-compare/p3_scoped_comparison.json
      - name: Independently generate and run original mixed-category MAKEGEO
        run: python3 native_cpp/reference/prepare_p3_mixed.py --reference-dir /tmp/p3-compare
      - name: Compute synthetic 38-category P3 C++ geophysics and GEO.DAT
        run: |
          /tmp/cteas-p3-build/cteas_p3_makegeo \
            /tmp/p3-compare/p3-mixed/run/makegeo.inp \
            /tmp/p3-compare/p3-mixed/lu.dat \
            /tmp/p3-compare/p1/terrel.dat \
            /tmp/p3-compare/p3-mixed/p3_cpp_geophysical.csv \
            /tmp/p3-compare/p3-mixed/p3_cpp_geo.dat
      - name: Compare synthetic mixed fraction/water/weighting against original
        run: |
          python3 native_cpp/reference/compare_p3_makegeo.py \
            --reference /tmp/p3-compare/p3-mixed/run/geo.dat \
            --cpp /tmp/p3-compare/p3-mixed/p3_cpp_geophysical.csv \
            --cpp-geo /tmp/p3-compare/p3-mixed/p3_cpp_geo.dat \
            --report /tmp/p3-compare/p3-mixed/p3_comparison.json
      - name: Archive immutable original outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-makegeo-original-reference
          path: /tmp/p3-compare
          retention-days: 7
          if-no-files-found: warn
