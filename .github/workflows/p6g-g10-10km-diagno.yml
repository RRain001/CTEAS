name: P6G G10 10km multisite DIAGNO selected tail

on:
  push:
    branches:
      - codex/p6g-g10-10km-multisite-diagno-tail-20261014
  pull_request:
    paths:
      - "native_cpp/modules/p6_calmet/include/cteas/p6/p6g_selected_hour_bridge.hpp"
      - "native_cpp/modules/p6_calmet/tests/p6g_g8_10km_year_stress_tests.cpp"
      - "native_cpp/modules/p6_calmet/CMakeLists.txt"
      - ".github/workflows/p6g-g10-10km-diagno.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g10-selected-diagno-tail:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict native P6G C++20
        run: cmake -S native_cpp/modules/p6_calmet -B "${{ runner.temp }}/p6g-g10" -DCMAKE_BUILD_TYPE=${{ matrix.mode }}
      - name: Build multistation annual tail and frozen DIAGNO/WIND1 regressions
        run: |
          cmake --build "${{ runner.temp }}/p6g-g10" --target \
            cteas_p6g_g8_10km_year_tests cteas_p6g_g9_multi_wind1_tests \
            cteas_p6_diagno_segment_tests cteas_p6_d9a_bridge_tests -j2
      - name: Test 120km 8784h selected WIND1-INTER2-SMOOTH-DIVCEL-W
        run: |
          ctest --test-dir "${{ runner.temp }}/p6g-g10" --output-on-failure \
            -R 'p6g_g8_multisite_10km_8784h_selected_source_bridge|p6g_g9_expanded_10km_multi_wind1_frozen_pair_parity|p6d_original_diagno_final_segment_software|p6d9a_wind1_inter2_diagno_selected_bridge_contract'
