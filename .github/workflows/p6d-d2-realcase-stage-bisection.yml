name: P6D D2 original stage-aligned real-case bisection
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/reference/p6d_d2_stage_bisection.py'
      - '.github/workflows/p6d-d2-realcase-stage-bisection.yml'
      - 'native_cpp/modules/p6_calmet/reference/p6d_d2_original_inter2_actual_trace.py'
      - 'native_cpp/modules/p6_calmet/reference/p6d_d2_compare_actual_inter2.py'
      - 'native_cpp/modules/p6_calmet/reference/p6d_d2_compare_upstream_stages.py'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/inter2_selected.hpp'
      - 'native_cpp/modules/p6_calmet/src/realcase_wind_field_main.cpp'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6d-d2-bisection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-stage-bisection:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    # One single P6D job; do not dispatch P7 or unrelated science tracks.
    runs-on: [cteas-managed, cteas-compute, Linux, X64]
    timeout-minutes: 75
    env:
      CASE_DIR: project/cases/hefei5km_2022_reference_case_20261011
      DGM_SHA: 972af841552f7a0eda6b02b221b6b2a808c61806054e634c617425d9ca9babdf
      MET_SHA: b1823cda92280888d70b00961ab39486036a3086e18637fff21efb4f4b237d30
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
    steps:
      - name: Fetch exact PR head and keep the frozen case read-only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify immutable original reference inputs and host
        shell: bash
        run: |
          set -euo pipefail
          echo "D2_PINNED_HEAD=$(git rev-parse HEAD)"
          echo "D2_RUNNER=$RUNNER_NAME"
          test "$(id -un)" != root
          test -x /usr/bin/g++-12
          test -f "$CASE_DIR/run/met/met.dat"
          echo "$MET_SHA  $CASE_DIR/run/met/met.dat" | sha256sum -c -
          DGM=native_cpp/modules/p6_calmet/reference/dgm_p6d_requests_2022/dgm_fields_hours.bin
          test -f "$DGM"
          echo "$DGM_SHA  $DGM" | sha256sum -c -
          test -s native_cpp/modules/p6_calmet/reference/p6d_d2_stage_bisection.py
          python3 -m py_compile native_cpp/modules/p6_calmet/reference/p6d_d2_stage_bisection.py
      - name: Build P6D original-case wind producer (bounded resources)
        shell: bash
        env:
          CXX: /usr/bin/g++-12
          FC: /usr/bin/gfortran-11
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/d2-build" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=/usr/bin/g++-12
          cmake --build "$RUNNER_TEMP/d2-build" --target cteas_p6_realcase_wind_field --parallel 4
      - name: Produce all 143 real Hefei 2022 hours
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/d2-build/cteas_p6_realcase_wind_field" --case "$CASE_DIR" --out "$RUNNER_TEMP/d2-product"
          test -s "$RUNNER_TEMP/d2-product/metadata.json"
          python3 - "$RUNNER_TEMP/d2-product" <<'PY'
          from pathlib import Path
          import sys
          d=Path(sys.argv[1])
          for tag in ("wind1_u_", "wind1_v_", "slope_corrected_u_", "slope_corrected_v_", "blend_u_", "blend_v_", "w_face_"):
              files=list(d.glob(tag+"*.f32"))
              assert len(files)==143, (tag,len(files))
          print("P6D_D2_ALL_143_HOURS_EMITTED=PASS")
          PY
      - name: Compare original before-SLOPE, after-SLOPE and final wind/face slices
        shell: bash
        run: |
          set -euo pipefail
          python3 native_cpp/modules/p6_calmet/reference/p6d_d2_stage_bisection.py \
            --original native_cpp/modules/p6_calmet/reference/dgm_p6d_requests_2022/dgm_fields_hours.bin \
            --product "$RUNNER_TEMP/d2-product" \
            --out "$RUNNER_TEMP/p6d-d2/stage-bisection.json" \
            | tee "$RUNNER_TEMP/p6d-d2-stage-stdout.txt"
          test -s "$RUNNER_TEMP/p6d-d2/stage-bisection.json"
          grep -q "DIAGNOSTIC_COMPLETED_NOT_ACCEPTED" "$RUNNER_TEMP/p6d-d2-stage-stdout.txt"
      - name: Prepare read-only original EL and ZII diagnostic forcing
        shell: bash
        run: |
          set -euo pipefail
          ORACLE=native_cpp/modules/p6_calmet/reference/dgm_p6d_requests_2022/dgm_cell.json
          echo "c4ef3b4cd116b0ed8d48967b8050b199bd094f35ccbe40863585c9dcb2f9ff5f  $ORACLE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/d2-reference-state"
          python3 - "$ORACLE" "$RUNNER_TEMP/d2-reference-state" <<'PY'
          import json, struct, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text())['rows']
          assert len(rows)==143
          assert [r['hour_index'] for r in rows]==list(range(1,144))
          for name,key in [('zii','ZII_TO_SIMILT'),('el','EL')]:
              Path(sys.argv[2],name+'.f32').write_bytes(
                  struct.pack('<143f',*(float(r[key]) for r in rows)))
          print('ORIGINAL_EL_ZII_143_HOUR_ORACLE_EXPORT=PASS')
          PY
      - name: Rerun 143 hours with original internal station-state oracles (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/d2-build/cteas_p6_realcase_wind_field" \
            --case "$CASE_DIR" --out "$RUNNER_TEMP/d2-product-oracle" \
            --fixtures "$RUNNER_TEMP/d2-wind1-fixtures" \
            --zii-cell "$RUNNER_TEMP/d2-reference-state/zii.f32" \
            --el-cell "$RUNNER_TEMP/d2-reference-state/el.f32" \
            --trace-inter2 "$RUNNER_TEMP/p6d-d2/cpp-inter2-actual.csv"
          python3 native_cpp/modules/p6_calmet/reference/p6d_d2_stage_bisection.py \
            --original native_cpp/modules/p6_calmet/reference/dgm_p6d_requests_2022/dgm_fields_hours.bin \
            --product "$RUNNER_TEMP/d2-product-oracle" \
            --out "$RUNNER_TEMP/p6d-d2/stage-bisection-oracle.json" \
            | tee "$RUNNER_TEMP/p6d-d2-stage-oracle-stdout.txt"
          echo "ORACLE_DRIVEN_P6D_IS_DIAGNOSTIC_ONLY_NOT_PRODUCTION_ACCEPTANCE"
      - name: Trace true original CALMET DIAGNO INTER2 calls with source-hash guard
        shell: bash
        run: |
          set -euo pipefail
          python3 native_cpp/modules/p6_calmet/reference/p6d_d2_original_inter2_actual_trace.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --case "$CASE_DIR" \
            --out "$RUNNER_TEMP/p6d-d2-original" \
            --compiler /usr/bin/gfortran-11
          test -s "$RUNNER_TEMP/p6d-d2-original/original_inter2_actual.csv"
          test -s "$RUNNER_TEMP/p6d-d2-original/original_inter2_evidence.json"
      - name: Compare 143h original and C++ wind before and after SLOPE
        shell: bash
        run: |
          set -euo pipefail
          python3 native_cpp/modules/p6_calmet/reference/p6d_d2_compare_upstream_stages.py \
            --original "$RUNNER_TEMP/p6d-d2-original/original_upstream_actual.csv" \
            --product "$RUNNER_TEMP/d2-product-oracle" \
            --out "$RUNNER_TEMP/p6d-d2/original-prepost-slope.json" \
            | tee "$RUNNER_TEMP/p6d-d2-slope-stage-stdout.txt"
          grep -q "COMPLETED_NOT_ACCEPTED" "$RUNNER_TEMP/p6d-d2-slope-stage-stdout.txt"
      - name: Check actual original WIND1 input columns against C++ fixture entry
        shell: bash
        run: |
          set -euo pipefail
          python3 native_cpp/modules/p6_calmet/reference/p6d_d2_compare_wind1_entry.py \
            --original "$RUNNER_TEMP/p6d-d2-original/original_wind1_station_inputs.csv" \
            --fixtures "$RUNNER_TEMP/d2-wind1-fixtures" \
            --index "$RUNNER_TEMP/d2-product-oracle/produced_hours.txt" \
            --out "$RUNNER_TEMP/p6d-d2/wind1-entry-comparison.json" \
            | tee "$RUNNER_TEMP/p6d-d2-wind1-entry-stdout.txt"
          test -s "$RUNNER_TEMP/p6d-d2/wind1-entry-comparison.json"
      - name: Compare actual original and actual C++ INTER2 operand snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 native_cpp/modules/p6_calmet/reference/p6d_d2_compare_actual_inter2.py \
            --original "$RUNNER_TEMP/p6d-d2-original/original_inter2_actual.csv" \
            --cpp "$RUNNER_TEMP/p6d-d2/cpp-inter2-actual.csv" \
            --out "$RUNNER_TEMP/p6d-d2/inter2-operands-comparison.json" \
            | tee "$RUNNER_TEMP/p6d-d2-actual-comparison-stdout.txt"
          grep -q "COMPLETED_NOT_SCIENTIFIC_PASS" "$RUNNER_TEMP/p6d-d2-actual-comparison-stdout.txt"
      - name: Archive immutable-provenance D2 stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6d-d2-stage-bisection-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/p6d-d2/stage-bisection.json
            ${{ runner.temp }}/p6d-d2-stage-stdout.txt
            ${{ runner.temp }}/d2-product/metadata.json
            ${{ runner.temp }}/p6d-d2/stage-bisection-oracle.json
            ${{ runner.temp }}/p6d-d2-stage-oracle-stdout.txt
            ${{ runner.temp }}/d2-product-oracle/metadata.json
            ${{ runner.temp }}/p6d-d2-original/original_wind1_station_inputs.csv
            ${{ runner.temp }}/p6d-d2/wind1-entry-comparison.json
            ${{ runner.temp }}/p6d-d2-wind1-entry-stdout.txt
            ${{ runner.temp }}/p6d-d2-original/original_inter2_actual.csv
            ${{ runner.temp }}/p6d-d2-original/original_upstream_actual.csv
            ${{ runner.temp }}/p6d-d2/original-prepost-slope.json
            ${{ runner.temp }}/p6d-d2-slope-stage-stdout.txt
            ${{ runner.temp }}/p6d-d2-original/original_inter2_evidence.json
            ${{ runner.temp }}/p6d-d2/cpp-inter2-actual.csv
            ${{ runner.temp }}/p6d-d2/inter2-operands-comparison.json
            ${{ runner.temp }}/p6d-d2-actual-comparison-stdout.txt
          if-no-files-found: error
          retention-days: 14
