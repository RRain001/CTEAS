name: P6G G11 10km multisite terrain FRADJ SLOPE

on:
  push:
    branches:
      - codex/p6g-g11-10km-source-terrain-fradj-slope-20261014
  pull_request:
    paths:
      - "native_cpp/modules/p6_calmet/include/cteas/p6/p6g_terrain_hour.hpp"
      - "native_cpp/modules/p6_calmet/include/cteas/p6/p6g_selected_hour_bridge.hpp"
      - "native_cpp/modules/p6_calmet/tests/p6g_g11_source_terrain_tests.cpp"
      - "native_cpp/modules/p6_calmet/tests/p6g_g8_10km_year_stress_tests.cpp"
      - "native_cpp/modules/p6_calmet/CMakeLists.txt"
      - "native_cpp/modules/p6_calmet/tests/p6g_g11_original_terrain_probe.cpp"
      - "native_cpp/modules/p6_calmet/reference/compare_g11_original_terrain_10km.py"
      - ".github/workflows/p6g-g11-10km-terrain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g11-terrain:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure strict Ubuntu GCC11 C++20
        run: cmake -S native_cpp/modules/p6_calmet -B "${{ runner.temp }}/p6g-g11" -DCMAKE_BUILD_TYPE=${{ matrix.mode }}
      - name: Build terrain, 8784h multisite and frozen subroutine tests
        run: |
          cmake --build "${{ runner.temp }}/p6g-g11" --target \
            cteas_p6g_g11_terrain_tests cteas_p6g_g8_10km_year_tests \
            cteas_p6_final_segment_tests cteas_p6g_g9_multi_wind1_tests \
            cteas_p6_d9a_bridge_tests -j2
      - name: Compare literal original Fortran TERSET/FRADJ/SLOPE vs 10km C++ U/V
        run: |
          command -v gfortran || (sudo apt-get update -qq && sudo apt-get install -y -qq gfortran)
          python3 native_cpp/modules/p6_calmet/reference/compare_g11_original_terrain_10km.py --mode ${{ matrix.mode }}
      - name: Run selected FRADJ/SLOPE 10km test and full-year 8784h terrain→DIAGNO
        run: |
          ctest --test-dir "${{ runner.temp }}/p6g-g11" --output-on-failure \
            -R 'p6g_g11_original_terrain_dynamic_10km_source_contract|p6g_g8_multisite_10km_8784h_selected_source_bridge|p6g_g9_expanded_10km_multi_wind1_frozen_pair_parity|p6d_original_diagno_final_segment_software|p6d9a_wind1_inter2_diagno_selected_bridge_contract'
