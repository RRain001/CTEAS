name: P6D CALMET original SLOPE parity (isolated)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/*slope*'
      - 'native_cpp/modules/p6_calmet/src/slope_flow_main.cpp'
      - 'native_cpp/modules/p6_calmet/tests/p6_slope_flow_tests.cpp'
      - 'native_cpp/modules/p6_calmet/reference/compare_original_slope.py'
      - 'docs/reconstruction_cpp/CI_FULL_REGRESSION_REQUEST.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p6d-original-slope:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select self-hosted C++20 and Fortran tools
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Install reference Fortran compiler
        run: gfortran --version | head -1
      - name: Configure strict standalone C++20
        run: cmake -S native_cpp/modules/p6_calmet -B /tmp/cteas-p6d -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build /tmp/cteas-p6d --parallel 2
      - name: CTest (including slope and upstream P6 A/C contracts)
        run: ctest --test-dir /tmp/cteas-p6d --output-on-failure
      - name: Literal original SLOPE vs independent C++20
        run: |
          python3 native_cpp/modules/p6_calmet/reference/compare_original_slope.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp /tmp/cteas-p6d/cteas_p6_slope \
            --out /tmp/p6d-slope-evidence
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6d-slope-reference-report
          path: /tmp/p6d-slope-evidence/p6d-slope-parity.json
          if-no-files-found: ignore
          retention-days: 14
