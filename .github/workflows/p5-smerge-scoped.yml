name: P5 SMERGE scoped C++20
on:
  pull_request:
    paths:
      - 'native_cpp/include/cteas/met_input/**'
      - 'native_cpp/tests/**'
      - 'native_cpp/modules/p5_smerge/**'
      - '.github/workflows/p5-smerge-scoped.yml'
jobs:
  unit:
    if: github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native_cpp/modules/p5_smerge -B /tmp/cteas-p5-build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build /tmp/cteas-p5-build -j2
      - name: Test
        run: ctest --test-dir /tmp/cteas-p5-build --output-on-failure

      - name: Verify copied NOAA sources and Python runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q native_cpp/modules/p5_smerge/data_prep
          python3 -m native_cpp.modules.p5_smerge.data_prep.prepare_inputs --expected-year 2022
          python3 - <<'PY'
          from pathlib import Path
          original = Path("engine/preprocess/smerge_surf_data")
          snapshot = Path("native_cpp/modules/p5_smerge/data_prep")
          for name in ("download_isd_by_grid.py","interpolate.py","clean_merge_filled_by_research_time.py","convert_cleaned_to_smerge_ready.py","generate_smerge_input_sections.py"):
              assert (original/name).read_bytes() == (snapshot/name).read_bytes(), name
          assert (original/"README.md").read_bytes() == (snapshot/"upstream_README.md").read_bytes()
          before=(original/"isd_to_smerge_and_fill.py").read_text()
          after=(snapshot/"isd_to_smerge_and_fill.py").read_text()
          old='SCRIPT_DIR = engine_path("preprocess", "smerge_surf_data")'
          new='SCRIPT_DIR = Path(__file__).resolve().parent'
          assert before.count(old)==1 and after==before.replace(old,new)
          print("P5_SOURCE_SNAPSHOT_SCOPED_ONE_LINE_PATCH=PASS")
          PY
