name: P1 P2 original reference capture
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native_cpp/reference/**'
      - 'docs/reconstruction_cpp/CI_FULL_REGRESSION_REQUEST.md'
jobs:
  capture:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select self-hosted C++20 and Fortran tools
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Install gfortran
        run: gfortran --version | head -1
      - name: Generate and run original P1/P2 in isolated path
        run: python3 native_cpp/reference/capture_p1_p2.py --output /tmp/cteas-reference-p1-p2
      - name: Independently parse exact original field content
        run: python3 native_cpp/reference/analyze_p1_p2.py --reference-dir /tmp/cteas-reference-p1-p2 --summary /tmp/cteas-reference-p1-p2/original_decoded_summary.json
      - name: Archive evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-p2-original-reference
          path: /tmp/cteas-reference-p1-p2
          if-no-files-found: warn
          retention-days: 7
