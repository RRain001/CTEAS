name: P6D original CALMET SMOOTH selected path parity
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/**'
      - '.github/workflows/p6d-smooth-original-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-smooth:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install original Fortran toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build strict C++20 and run all P6 CTests
        run: |
          cmake -S native_cpp/modules/p6_calmet -B /tmp/cteas-p6d-smooth -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cteas-p6d-smooth --parallel 2
          ctest --test-dir /tmp/cteas-p6d-smooth --output-on-failure
      - name: Original CALMET unmodified SMOOTH Fortran against C++
        run: |
          python3 native_cpp/modules/p6_calmet/reference/compare_original_smooth.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp /tmp/cteas-p6d-smooth/cteas_p6_smooth \
            --out /tmp/p6d-smooth-reference
      - name: Preserve independent comparison JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-calmet-smooth-parity
          path: /tmp/p6d-smooth-reference/p6d-smooth-parity.json
          if-no-files-found: warn
          retention-days: 14
