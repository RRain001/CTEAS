name: P6D original CALMET SLOPE isolated parity
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/**'
      - '.github/workflows/p6d-calmet-slope-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-slope-parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install original Fortran compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build strict C++20
        run: |
          cmake -S native_cpp/modules/p6_calmet -B /tmp/cteas-p6d-build -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cteas-p6d-build --parallel 2
          ctest --test-dir /tmp/cteas-p6d-build --output-on-failure
      - name: Original vendor source SHA and real SLOPE source parity
        run: |
          python3 native_cpp/modules/p6_calmet/reference/compare_original_slope.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp /tmp/cteas-p6d-build/cteas_p6_slope \
            --out /tmp/cteas-p6d-slope-parity
      - name: Preserve independent parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6d-calmet-slope-fortran-parity
          path: /tmp/cteas-p6d-slope-parity/slope-parity.json
          if-no-files-found: warn
          retention-days: 14
