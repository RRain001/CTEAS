name: P7 native POINTS1 release and 143h cadence
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p7_calpuff/**'
      - '.github/workflows/p7-native-point-hourly-cadence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p7-native-point-hourly-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  point-hourly-cadence:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: [cteas-managed, Linux, X64, cteas-r14]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /native_cpp/modules/p7_calpuff/**
      - name: Strict native POINTS1 REAL4 release schedule with PG and rise
        shell: bash
        run: |
          set -euo pipefail
          echo "P7_RELEASE_RUNNER=${RUNNER_NAME} HOST=$(hostname)"
          if command -v g++-12 >/dev/null 2>&1; then cpp=$(command -v g++-12);
          elif command -v g++-11 >/dev/null 2>&1; then cpp=$(command -v g++-11);
          else cpp=$(command -v c++); fi
          build="${RUNNER_TEMP}/p7-release-hourly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cmake -S native_cpp/modules/p7_calpuff -B "$build" \
            -DCMAKE_CXX_COMPILER="$cpp" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$build" --parallel 2 --target cteas_p7_original_point_hourly_cadence_tests
          ctest --test-dir "$build" -R '^cteas_p7_point_hourly_cadence_(1|6|143)h$' --output-on-failure
          echo 'P7_NATIVE_POINTS1_CADENCE_143H=PASS'
          echo 'P7_FROZEN_2022_RLSMET_WROUT1=NOT_YET_ACCEPTED'
