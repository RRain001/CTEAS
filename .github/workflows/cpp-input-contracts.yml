name: C++ input contracts
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - 'native_cpp/CMakeLists.txt'
      - 'native_cpp/src/**'
      - 'native_cpp/include/**'
      - 'native_cpp/tests/**'
      - 'calpuff_terrain_and_landuse_data_crop/hefei_5km/**'
      - '.github/workflows/cpp-input-contracts.yml'
      - 'docs/reconstruction_cpp/CI_FULL_REGRESSION_REQUEST.md'
  push:
    branches:
      - 'codex/cpp20-p1-p2-foundation-20261010'
    paths:
      - 'native_cpp/**'
      - '.github/workflows/cpp-input-contracts.yml'
jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Select self-hosted C++20 and Fortran tools
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Install GDAL headers
        run: |
          if ! pkg-config --exists gdal; then
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libgdal-dev
          fi
      - name: Configure
        run: cmake -S native_cpp -B /tmp/cteas-cpp-build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build /tmp/cteas-cpp-build -j2
      - name: Unit tests
        run: ctest --test-dir /tmp/cteas-cpp-build --output-on-failure
      - name: Read immutable cropped source inputs
        shell: bash
        run: |
          set -euo pipefail
          /tmp/cteas-cpp-build/cteas_geo_inspect terrain calpuff_terrain_and_landuse_data_crop/hefei_5km/china_srtm/srtm_60_06_hefei_5km.tif | tee /tmp/terrain.txt
          /tmp/cteas-cpp-build/cteas_geo_inspect landuse calpuff_terrain_and_landuse_data_crop/hefei_5km/eurasia_asia_landuse/eausgs2_0la_hefei_5km.generic.txt | tee /tmp/landuse.txt
          grep -q 'width=90 height=77' /tmp/terrain.txt
          grep -q 'datum=ESR-S categories=38 points=57600' /tmp/landuse.txt
      - name: Independently verify crop SHA-256
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('calpuff_terrain_and_landuse_data_crop/hefei_5km')
          info=json.loads((root/'crop_info.json').read_text())
          for item in [info['terrain'][0],info['landuse']['generic']]:
              p=pathlib.Path(item['output'])
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              assert digest==item['sha256'],(p,digest,item['sha256'])
              print(f'INPUT_SHA256_PASS {p.name}: {digest}')
          PY
