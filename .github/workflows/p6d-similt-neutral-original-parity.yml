name: P6D WIND1 neutral SIMILT original source parity
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/**'
      - '.github/workflows/p6d-similt-neutral-original-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p6d-similt-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-similt-neutral:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    # P6D alone owns this custom label; never select generic self-hosted workers.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      # Hosted Actions check out the exact PR SHA; obsolete local-desktop
      # identity and network-fallback bootstrap are intentionally removed.
      - name: Checkout complete immutable PR source
        uses: actions/checkout@v4
      - name: Require original source and all selected P6D implementation files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            native_cpp/modules/p6_calmet/CMakeLists.txt \
            native_cpp/modules/p6_calmet/reference/compare_original_similt_neutral.py \
            native_cpp/modules/p6_calmet/include/cteas/p6/similt_neutral.hpp \
            engine/vendor/src/CALMET_v6.5.0_L150223/calmet.for \
            engine/vendor/src/CALMET_v6.5.0_L150223/params.met; do
            test -s "$path" || { echo "::error::Missing $path"; exit 1; }
          done
      - name: Install GitHub-hosted original Fortran and C++20 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++-12 gfortran-12
      - name: Select isolated versioned GCC and Fortran compilers
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Strict C++20 build and complete scoped P6 regression CTests
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/cteas-similt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cmake -S native_cpp/modules/p6_calmet -B "$build" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$build" --parallel 2
          ctest --test-dir "$build" --output-on-failure
      - name: Compare unchanged original SIMILT against independent C++20
        shell: bash
        run: |
          set -euo pipefail
          python3 native_cpp/modules/p6_calmet/reference/compare_original_similt_neutral.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp "$RUNNER_TEMP/cteas-similt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/cteas_p6_similt_neutral" \
            --out "$RUNNER_TEMP/cteas-similt-parity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Save unchanged-source numerical comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6d-similt-neutral-source-parity
          path: ${{ runner.temp }}/cteas-similt-parity-${{ github.run_id }}-${{ github.run_attempt }}/p6d-similt-neutral-parity.json
          if-no-files-found: warn
          retention-days: 14
