name: P6D original CALMET MINIM DIVCEL WINDBC parity
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - '.github/scripts/p6d_verified_checkout.py'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/*minim*'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/*divcel*'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/*wind*'
      - 'native_cpp/modules/p6_calmet/src/minim_main.cpp'
      - 'native_cpp/modules/p6_calmet/tests/p6_minim_tests.cpp'
      - 'native_cpp/modules/p6_calmet/reference/compare_original_minim.py'
      - 'docs/reconstruction_cpp/CI_FULL_REGRESSION_REQUEST.md'
      - '.github/workflows/p6d-minim-original-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-minim:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # Hosted Actions check out the exact PR SHA; obsolete local-desktop
      # identity and network-fallback bootstrap are intentionally removed.
      - name: Checkout complete immutable PR source
        uses: actions/checkout@v4
      - name: Verify complete P6D source tree
        shell: bash
        run: |
          set -euo pipefail
          for p in native_cpp/modules/p6_calmet/CMakeLists.txt \
                   engine/vendor/src/CALMET_v6.5.0_L150223/calmet.for \
                   native_cpp/modules/p6_calmet/reference/compare_original_inter2.py \
                   .github/actions/cteas-linux-toolchain/action.yml; do
            test -s "$p" || { echo "::error::Missing source $p"; exit 1; }
          done
      - name: Install GitHub-hosted original Fortran and C++20 toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++-12 gfortran-12
      - name: Select isolated versioned GCC and Fortran compilers
        uses: ./.github/actions/cteas-linux-toolchain
      - name: Install original Fortran toolchain
        run: gfortran --version | head -1
      - name: Build strict C++20 and test regressions
        run: |
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/cteas-p6d-minim-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/cteas-p6d-minim-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/cteas-p6d-minim-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output-on-failure
      - name: Execute literal original MINIM DIVCEL WINDBC source parity
        run: |
          python3 native_cpp/modules/p6_calmet/reference/compare_original_minim.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp "$RUNNER_TEMP/cteas-p6d-minim-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"/cteas_p6_minim \
            --out "$RUNNER_TEMP/p6d-minim-parity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve scientific audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-calmet-minim-parity
          path: ${{ runner.temp }}/p6d-minim-parity-${{ github.run_id }}-${{ github.run_attempt }}/p6d-minim-parity.json
          if-no-files-found: warn
          retention-days: 14
