name: P6D original CALMET MINIM DIVCEL WINDBC parity
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/**'
      - '.github/workflows/p6d-minim-original-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-minim:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install original Fortran toolchain
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Build strict C++20 and test regressions
        run: |
          cmake -S native_cpp/modules/p6_calmet -B /tmp/cteas-p6d-minim -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cteas-p6d-minim --parallel 2
          ctest --test-dir /tmp/cteas-p6d-minim --output-on-failure
      - name: Execute literal original MINIM DIVCEL WINDBC source parity
        run: |
          python3 native_cpp/modules/p6_calmet/reference/compare_original_minim.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp /tmp/cteas-p6d-minim/cteas_p6_minim \
            --out /tmp/p6d-minim-parity
      - name: Preserve scientific audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-calmet-minim-parity
          path: /tmp/p6d-minim-parity/p6d-minim-parity.json
          if-no-files-found: warn
          retention-days: 14
