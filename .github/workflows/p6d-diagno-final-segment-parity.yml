name: P6D original DIAGNO final 3D W segment parity
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/**'
      - '.github/workflows/p6d-diagno-final-segment-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-diagno-segment:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged Fortran reference compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: C++20 build and all prior P6 CTests
        run: |
          cmake -S native_cpp/modules/p6_calmet -B /tmp/cteas-p6d-final -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/cteas-p6d-final --parallel 2
          ctest --test-dir /tmp/cteas-p6d-final --output-on-failure
      - name: Literal DIAGNO source L6119–6148 and vendor Fortran against C++
        run: |
          python3 native_cpp/modules/p6_calmet/reference/compare_original_diagno_final_segment.py \
            --vendor engine/vendor/src/CALMET_v6.5.0_L150223 \
            --cpp /tmp/cteas-p6d-final/cteas_p6_final_segment \
            --out /tmp/cteas-diagno-original-segment
      - name: Record comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6d-original-diagno-selected-segment
          path: /tmp/cteas-diagno-original-segment/p6d-final-segment-parity.json
          if-no-files-found: warn
          retention-days: 14
