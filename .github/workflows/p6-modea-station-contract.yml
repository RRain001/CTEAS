name: P6 Mode A original CALMET station geometry

on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/**'
      - '.github/workflows/p6-modea-station-contract.yml'
  workflow_dispatch:

concurrency:
  group: p6-modea-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-compat:
    runs-on: [self-hosted, Linux, X64, lhy-desktop]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check original Fortran availability
        shell: bash
        run: |
          command -v cmake
          command -v python3
          command -v gfortran-11 || command -v gfortran-12 || command -v gfortran
      - name: Configure P6 contract build
        shell: bash
        run: cmake -S native_cpp/modules/p6_calmet -B "${RUNNER_TEMP}/cteas-p6-modea" -DCMAKE_BUILD_TYPE=Debug
      - name: Compile P6 real-case and all scoped contract tests
        shell: bash
        run: cmake --build "${RUNNER_TEMP}/cteas-p6-modea" --parallel 2
      - name: Original station and P3-P5 handoff CTest
        shell: bash
        run: |
          ctest --test-dir "${RUNNER_TEMP}/cteas-p6-modea" \
            --output-on-failure \
            -R '^(p6_modea_original_grid_generator_to_metinp|p6d_(original_metinp_station_deck_input|p3_p4_p5_metinp_station_contract|original_readcf_real4_fortran_source|realcase_wind_producer_case_contract))
      - name: Release float32 station geometry regression
        shell: bash
        run: |
          cmake -S native_cpp/modules/p6_calmet -B "${RUNNER_TEMP}/cteas-p6-modea-release" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/cteas-p6-modea-release" --target cteas_p6_station_deck_tests --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/cteas-p6-modea-release" --output-on-failure -R '^p6d_original_metinp_station_deck_input$'
      - name: Rerun full 143-hour P6D/P6F/P6E versus frozen original U/V/W
        shell: bash
        run: |
          python3 scripts/run_p6_end_to_end.py \
            --case project/cases/hefei5km_2022_reference_case_20261011 \
            --build-dir "${RUNNER_TEMP}/cteas-p6-modea-g6-build" \
            --work "${RUNNER_TEMP}/cteas-p6-modea-g6-work"
      - name: Archive 143-hour U/V/W numeric field verdicts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-modea-full143-original-uv-w-verdicts
          path: ${{ runner.temp }}/cteas-p6-modea-g6-work/
          if-no-files-found: warn
      - name: Archive READCF source-oracle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-modea-readcf-source-parity
          path: ${{ runner.temp }}/cteas-p6-modea/original_readcf_station/
          if-no-files-found: warn

      - name: Release float32 station geometry regression
        shell: bash
        run: |
          cmake -S native_cpp/modules/p6_calmet -B "${RUNNER_TEMP}/cteas-p6-modea-release" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/cteas-p6-modea-release" --target cteas_p6_station_deck_tests --parallel 2
          ctest --test-dir "${RUNNER_TEMP}/cteas-p6-modea-release" --output-on-failure -R '^p6d_original_metinp_station_deck_input$'
      - name: Rerun full 143-hour P6D/P6F/P6E versus frozen original U/V/W
        shell: bash
        run: |
          python3 scripts/run_p6_end_to_end.py \
            --case project/cases/hefei5km_2022_reference_case_20261011 \
            --build-dir "${RUNNER_TEMP}/cteas-p6-modea-g6-build" \
            --work "${RUNNER_TEMP}/cteas-p6-modea-g6-work"
      - name: Archive 143-hour U/V/W numeric field verdicts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-modea-full143-original-uv-w-verdicts
          path: ${{ runner.temp }}/cteas-p6-modea-g6-work/
          if-no-files-found: warn
      - name: Archive READCF source-oracle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p6-modea-readcf-source-parity
          path: ${{ runner.temp }}/cteas-p6-modea/original_readcf_station/
          if-no-files-found: warn
