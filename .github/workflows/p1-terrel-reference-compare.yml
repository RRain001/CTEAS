name: P1 terrain Fortran numerical comparison
on:
  pull_request:
    paths:
      - 'native_cpp/**'
      - '.github/workflows/p1-terrel-reference-compare.yml'
jobs:
  compare:
    if: github.event.pull_request.head.repo.full_name == 'RRain001/CTEAS'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ GDAL and original Fortran toolchains
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev gfortran
      - name: Configure P1 only (shared foundations unchanged)
        run: cmake -S native_cpp/p1 -B /tmp/cteas-p1-build -DCMAKE_BUILD_TYPE=Debug
      - name: Compile modern C++ P1
        run: cmake --build /tmp/cteas-p1-build -j2
      - name: CTest scoped P1 cell indexing
        run: ctest --test-dir /tmp/cteas-p1-build --output-on-failure
      - name: Rebuild/run immutable original reference
        run: python3 native_cpp/reference/capture_p1_p2.py --output /tmp/p1-reference
      - name: Generate independent C++ P1 terrain
        shell: bash
        run: |
          set -euo pipefail
          read -r X Y < <(python3 - <<'PY'
          import json
          m=json.load(open('/tmp/p1-reference/manifest.json'))
          print(m['grid']['x0_km'],m['grid']['y0_km'])
          PY
          )
          /tmp/cteas-p1-build/cteas_p1_terrain calpuff_terrain_and_landuse_data_crop/hefei_5km/china_srtm/srtm_60_06_hefei_5km.tif "$X" "$Y" /tmp/p1-reference/p1_cpp_terrain.csv
      - name: Compare original field heights and actual integer hit counts
        run: python3 native_cpp/reference/compare_p1_terrain.py --reference-dir /tmp/p1-reference --cpp /tmp/p1-reference/p1_cpp_terrain.csv --report /tmp/p1-reference/p1_terrain_comparison.json
      - name: Archive independent evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-terrel-reference-evidence
          path: /tmp/p1-reference
          if-no-files-found: warn
          retention-days: 7
