name: CTEAS isolated modern Linux compilers
description: 'Linux C++20/Fortran toolchain selection for GitHub-hosted ubuntu-22.04 jobs'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" != "Linux" || "$RUNNER_ARCH" != "X64" ]]; then
          echo "::error::CTEAS validated runner requires Linux/X64"
          exit 1
        fi
        # GitHub-hosted Ubuntu images are ephemeral. Install only when the
        # image does not already provide the required toolchain.
        if ! command -v g++-12 >/dev/null 2>&1 ||
           { ! command -v gfortran-13 >/dev/null 2>&1 &&
             ! command -v gfortran-12 >/dev/null 2>&1 &&
             ! command -v gfortran-11 >/dev/null 2>&1; }; then
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++-12 gfortran-12
        fi
        if command -v g++-13 >/dev/null 2>&1; then
          cpp="$(command -v g++-13)"
        elif command -v g++-12 >/dev/null 2>&1; then
          cpp="$(command -v g++-12)"
        else
          echo "::error::Missing g++-12 or newer on GitHub-hosted Ubuntu"
          exit 1
        fi
        if command -v gfortran-13 >/dev/null 2>&1; then
          fort="$(command -v gfortran-13)"
        elif command -v gfortran-12 >/dev/null 2>&1; then
          fort="$(command -v gfortran-12)"
        elif command -v gfortran-11 >/dev/null 2>&1; then
          fort="$(command -v gfortran-11)"
        else
          echo "::error::Missing gfortran-11 or newer on GitHub-hosted Ubuntu"
          exit 1
        fi
        # Verify this compiler's standard library actually implements the
        # calendrical C++20 sys_seconds requirement; GCC 11.x does not.
        printf '#include <chrono>\nint main(){std::chrono::sys_seconds s{}; (void)s;}\n' | "$cpp" -std=c++20 -x c++ -fsyntax-only -
        command -v cmake
        command -v python3
        "$cpp" --version | head -1
        "$fort" --version | head -1
        tool_bin="$RUNNER_TEMP/cteas-toolchain-$GITHUB_RUN_ID"
        mkdir -p "$tool_bin"
        ln -sfn "$fort" "$tool_bin/gfortran"
        echo "$tool_bin" >> "$GITHUB_PATH"
        echo "CXX=$cpp" >> "$GITHUB_ENV"
        echo "FC=$fort" >> "$GITHUB_ENV"
        echo "CTEAS_CI_GITHUB_HOSTED=1" >> "$GITHUB_ENV"
        echo "CI toolchain: CXX=$cpp FC=$fort (job-local gfortran shim)"
